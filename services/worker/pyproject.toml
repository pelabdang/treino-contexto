[project]
name = "treino-worker"
version = "0.1.0"
description = "Worker do treino-contexto (ingestão e processamento)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "treino-api",
]

[tool.uv.sources]
treino-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
