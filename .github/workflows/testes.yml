name: testes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: pytest -q || [ $? -eq 5 ]