[project]
name = "treino-contexto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.uv.sources]
treino-api = { workspace = true }
treino-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "treino-api",
    "treino-worker",
    "fit-tool>=0.9.17",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests", "tests"]
addopts = "--import-mode=importlib"
