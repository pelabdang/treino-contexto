<svg xmlns="http://www.w3.org/2000/svg" width="740" height="640" viewBox="0 0 740 640" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Esboço do check-in pós-treino: pergunta 1 (PSE) e pergunta 3 (observação), tema claro</title>
  <desc id="d">Esboço da issue 295. Dados sintéticos. Duas telas de celular pequeno (360 por 640) lado a lado: a PSE e a observação. Cada uma cabe sem rolar.</desc>
  <style>
    .card{fill:#FFFFFF;stroke:#DEDBD3;stroke-width:1}
    .t{fill:#1A1D1F}.t2{fill:#4C5257}.dest{fill:#0B6A6E}
    .cel{fill:#FFFFFF;stroke:#7D7A72;stroke-width:1}
    .sel{fill:#DCEFEE;stroke:#0B6A6E;stroke-width:2}
    .div{stroke:#DEDBD3;stroke-width:1}
  </style>
  <rect width="740" height="640" fill="#CFCCC4"/>
<rect x="0" y="0" width="360" height="640" fill="#F6F5F1"/>
<path d="M30 36 h-12 m5 -5 l-5 5 l5 5" stroke="#0B6A6E" stroke-width="2" fill="none"/><text x="40" y="41" class="dest" font-size="16" font-weight="600">Voltar</text>
<text x="16" y="76" class="t" font-size="24" font-weight="700">Check-in do treino</text>
<circle cx="23" cy="94" r="7" fill="#B4470F"/><text x="36" y="99" class="t2" font-size="14">Corrida, 45 min · 09/11/25</text>
<text x="16" y="126" class="t2" font-size="14" font-weight="500">Pergunta 1 de 3</text>
<rect x="16" y="134" width="104" height="4" rx="2" fill="#0B6A6E"/>
<rect x="128" y="134" width="104" height="4" rx="2" fill="#DEDBD3"/>
<rect x="240" y="134" width="104" height="4" rx="2" fill="#DEDBD3"/>
<text x="16" y="168" class="t" font-size="18" font-weight="600">Qual foi o esforço do treino?</text>
<text x="16" y="188" class="t2" font-size="13">0 é repouso e 10 é o máximo. É a sua percepção.</text>
<rect class="cel" x="16.5" y="204.5" width="159" height="51" rx="8"/>
<text x="30" y="236" class="t" font-size="18" font-weight="700">0</text>
<text x="56" y="235" class="t2" font-size="14">repouso</text>
<rect class="cel" x="16.5" y="262.5" width="159" height="51" rx="8"/>
<text x="30" y="294" class="t" font-size="18" font-weight="700">1</text>
<text x="56" y="293" class="t2" font-size="14">muito leve</text>
<rect class="cel" x="16.5" y="320.5" width="159" height="51" rx="8"/>
<text x="30" y="352" class="t" font-size="18" font-weight="700">2</text>
<text x="56" y="351" class="t2" font-size="14">leve</text>
<rect class="cel" x="16.5" y="378.5" width="159" height="51" rx="8"/>
<text x="30" y="410" class="t" font-size="18" font-weight="700">3</text>
<text x="56" y="409" class="t2" font-size="14">moderado</text>
<rect class="cel" x="16.5" y="436.5" width="159" height="51" rx="8"/>
<text x="30" y="468" class="t" font-size="18" font-weight="700">4</text>
<text x="56" y="467" class="t2" font-size="13">um pouco difícil</text>
<rect class="sel" x="17" y="495" width="158" height="50" rx="8"/>
<text x="30" y="526" class="t" font-size="18" font-weight="700">5</text>
<text x="56" y="525" class="t2" font-size="14">difícil</text>
<path d="M154 520 l5 5 l9 -10" stroke="#0B6A6E" stroke-width="2.5" fill="none"/>
<rect class="cel" x="184.5" y="204.5" width="159" height="51" rx="8"/>
<text x="198" y="236" class="t" font-size="18" font-weight="700">6</text>
<rect class="cel" x="184.5" y="262.5" width="159" height="51" rx="8"/>
<text x="198" y="294" class="t" font-size="18" font-weight="700">7</text>
<text x="224" y="293" class="t2" font-size="13">muito difícil</text>
<rect class="cel" x="184.5" y="320.5" width="159" height="51" rx="8"/>
<text x="198" y="352" class="t" font-size="18" font-weight="700">8</text>
<rect class="cel" x="184.5" y="378.5" width="159" height="51" rx="8"/>
<text x="198" y="410" class="t" font-size="18" font-weight="700">9</text>
<rect class="cel" x="184.5" y="436.5" width="159" height="51" rx="8"/>
<text x="198" y="468" class="t" font-size="18" font-weight="700">10</text>
<text x="224" y="467" class="t2" font-size="14">máximo</text>
<text x="184" y="524" class="t2" font-size="13">(a lista acaba no 10)</text>
<text x="16" y="594" class="t2" font-size="13">A PSE é só sua: não se compara com a de outros atletas.</text>
<text x="16" y="616" class="t2" font-size="13">Ao tocar, o app vai para a próxima pergunta.</text>
<rect x="380" y="0" width="360" height="640" fill="#F6F5F1"/>
<path d="M410 36 h-12 m5 -5 l-5 5 l5 5" stroke="#0B6A6E" stroke-width="2" fill="none"/><text x="420" y="41" class="dest" font-size="16" font-weight="600">Voltar</text>
<text x="396" y="76" class="t" font-size="24" font-weight="700">Check-in do treino</text>
