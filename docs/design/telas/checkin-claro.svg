<text x="396" y="126" class="t2" font-size="14" font-weight="500">Pergunta 3 de 3</text>
<rect x="396" y="134" width="104" height="4" rx="2" fill="#0B6A6E"/>
<rect x="508" y="134" width="104" height="4" rx="2" fill="#0B6A6E"/>
<rect x="620" y="134" width="104" height="4" rx="2" fill="#0B6A6E"/>
<text x="396" y="168" class="t" font-size="18" font-weight="600">Quer registrar mais alguma coisa?</text>
<text x="396" y="188" class="t2" font-size="13">Toque no que combina. Pode marcar mais de um.</text>
<rect class="cel" x="396.5" y="204.5" width="71" height="47" rx="8"/><text x="410" y="234" class="t" font-size="16">Dor</text>
<rect class="sel" x="477" y="205" width="110" height="46" rx="8"/><path d="M488 228 l4 4 l8 -9" stroke="#0B6A6E" stroke-width="2.5" fill="none"/><text x="508" y="234" class="t" font-size="16" font-weight="600">Cansaço</text>
<rect class="cel" x="596.5" y="204.5" width="119" height="47" rx="8"/><text x="610" y="234" class="t" font-size="16">Sono ruim</text>
<rect class="cel" x="396.5" y="260.5" width="87" height="47" rx="8"/><text x="410" y="290" class="t" font-size="16">Calor</text>
<rect class="sel" x="493" y="261" width="230" height="46" rx="8"/><path d="M504 284 l4 4 l8 -9" stroke="#0B6A6E" stroke-width="2.5" fill="none"/><text x="524" y="290" class="t" font-size="16" font-weight="600">Trabalho ou estresse</text>
<text x="396" y="342" class="t" font-size="16" font-weight="600">Quer acrescentar algo? (opcional)</text>
<rect class="cel" x="396.5" y="352.5" width="327" height="95" rx="8"/>
<text x="408" y="380" class="t" font-size="16">Semana puxada no trabalho.</text>
<text x="723" y="468" text-anchor="end" class="t2" font-size="13">26 de 500</text>
<rect x="396" y="480" width="328" height="48" rx="8" fill="#0B6A6E"/><text x="560" y="510" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Salvar check-in</text>
<rect class="cel" x="396.5" y="540.5" width="327" height="47" rx="8"/><text x="560" y="570" text-anchor="middle" class="dest" font-size="16" font-weight="600">Nada a relatar</text>
<text x="396" y="614" class="t2" font-size="13">“Nada a relatar” salva na hora.</text>
