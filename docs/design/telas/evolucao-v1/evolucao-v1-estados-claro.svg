<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1000" width="390" height="1000" role="img" aria-label="Evolução v1, estados, tema claro"><title>Evolução v1, estados, tema claro</title><rect width="390" height="1000" fill="#F6F5F1"/><text x="16" y="36" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#4C5257" text-anchor="start" letter-spacing="1">CARREGANDO</text><rect x="16" y="46" width="358" height="120" rx="12" fill="#FFFFFF" stroke="#DEDBD3" stroke-width="1"/><rect x="32" y="62" width="180" height="16" rx="4" fill="#ECEAE4"/><rect x="32" y="90" width="326" height="60" rx="4" fill="#ECEAE4"/><text x="32" y="184" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4C5257" text-anchor="start">Carregando (só para o leitor de tela)</text><text x="16" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#4C5257" text-anchor="start" letter-spacing="1">APRENDENDO (MENOS DE 8 TREINOS DO TIPO)</text><rect x="16" y="220" width="358" height="260" rx="12" fill="#FFFFFF" stroke="#DEDBD3" stroke-width="1"/><text x="32" y="248" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1A1D1F" text-anchor="start">Pace do treino leve</text><rect x="32" y="262" width="326" height="50" rx="8" fill="#EEF9C9"/><text x="44" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1A1D1F" text-anchor="start">Ainda estamos aprendendo o seu normal no</text><text x="44" y="299" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1A1D1F" text-anchor="start">treino leve: faltam 3 treinos para mostrar a</text><text x="44" y="316" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1A1D1F" text-anchor="start">faixa.</text><circle cx="108.0" cy="423" r="5" fill="#FFFFFF" stroke="#1A5FA8" stroke-width="2.5"/><circle cx="168.8" cy="408" r="5" fill="#FFFFFF" stroke="#1A5FA8" stroke-width="2.5"/><circle cx="222.0" cy="398" r="5" fill="#FFFFFF" stroke="#1A5FA8" stroke-width="2.5"/><circle cx="267.6" cy="413" r="5" fill="#FFFFFF" stroke="#1A5FA8" stroke-width="2.5"/><circle cx="313.2" cy="388" r="5" fill="#FFFFFF" stroke="#1A5FA8" stroke-width="2.5"/><path d="M108.0 423.0 L168.8 408.0 L222.0 398.0 L267.6 413.0 L313.2 388.0" fill="none" stroke="#1A5FA8" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><text x="32" y="436" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4C5257" text-anchor="start">Pontos sem faixa e sem destaque. Tocar abre o treino.</text><text x="32" y="456" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4C5257" text-anchor="start">5 treinos · 8 são necessários</text><text x="16" y="500" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#4C5257" text-anchor="start" letter-spacing="1">VAZIO (NENHUM DADO NESSA SÉRIE)</text><rect x="16" y="510" width="358" height="190" rx="12" fill="#FFFFFF" stroke="#DEDBD3" stroke-width="1"/><path d="M150 578 L180 578 L190 556 L204 600 L214 578 L240 578" fill="none" stroke="#4C5257" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="634" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#1A1D1F" text-anchor="middle">Sem treinos de tiros ainda</text><text x="195" y="656" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#4C5257" text-anchor="middle">Quando você fizer tiros de 1 km, a evolução aparece aqui.</text><text x="195" y="676" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#2F6600" text-anchor="middle">Escolher outra série</text><text x="16" y="730" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#4C5257" text-anchor="start" letter-spacing="1">ERRO</text><rect x="16" y="740" width="358" height="170" rx="12" fill="#FFFFFF" stroke="#DEDBD3" stroke-width="1"/><text x="195" y="792" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#8A5300" text-anchor="middle">⚠</text><text x="195" y="824" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A1D1F" text-anchor="middle">Não foi possível carregar esta série.</text><text x="195" y="844" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#4C5257" text-anchor="middle">Verifique a conexão e tente de novo.</text><rect x="110" y="858" width="170" height="40" rx="10" fill="#12200A"/><text x="195.0" y="883.0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#C6F432" text-anchor="middle">Tentar de novo</text></svg>