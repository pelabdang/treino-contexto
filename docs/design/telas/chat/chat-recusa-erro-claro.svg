ize="14.5" font-weight="500" fill="#1A1D1F" text-anchor="start">Não consegui responder agora.</text><text x="30" y="588" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="500" fill="#1A1D1F" text-anchor="start">Tente de novo em instantes.</text><rect x="30" y="606" width="314" height="44" rx="10" fill="#12200A"/><text x="187" y="634" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#C6F432" text-anchor="middle">Tentar de novo</text><rect x="0" y="716" width="390" height="128" rx="0" fill="#FFFFFF" stroke="#DEDBD3" stroke-width="1"/><rect x="16" y="730" width="358" height="52" rx="10" fill="#F6F5F1" stroke="#7D7A72" stroke-width="1.5"/><text x="30" y="762" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" fill="#4C5257" text-anchor="start">Escreva a sua pergunta…</text><rect x="330" y="736" width="38" height="40" rx="8" fill="#12200A"/><text x="349" y="763" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#C6F432" text-anchor="middle">↑</text><text x="16" y="806" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4C5257" text-anchor="start">A sua pergunta vai a um serviço de IA.</text></svg>