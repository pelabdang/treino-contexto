<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Chat: recusa e erro, tema claro"><title>Chat: recusa e erro, tema claro</title><rect width="390" height="844" fill="#F6F5F1"/><text x="16" y="22" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1D1F" text-anchor="start">9:41</text><text x="374" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4C5257" text-anchor="end">100%</text><text x="28" y="70" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="500" fill="#1A1D1F" text-anchor="middle">‹</text><text x="52" y="66" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1A1D1F" text-anchor="start">Pergunte ao seu treino</text><text x="374" y="66" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2F6600" text-anchor="end">Conversas ›</text><line x1="0" y1="92" x2="390" y2="92" stroke="#DEDBD3" stroke-width="1"/><rect x="116.0" y="108" width="258.0" height="40" rx="14" fill="#ECEAE4"/><text x="130.0" y="134" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="500" fill="#1A1D1F" text-anchor="start">Qual a melhor receita de bolo?</text><text x="374" y="164" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#4C5257" text-anchor="end">Você · 14:40</text><rect x="16" y="180" width="342" height="90" rx="12" fill="#FFFFFF" stroke="#7D7A72" stroke-width="1" stroke-dasharray="5 4"/><text x="30" y="208" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="500" fill="#1A1D1F" text-anchor="start">Eu respondo perguntas sobre os seus treinos.</text><text x="30" y="228" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="500" fill="#1A1D1F" text-anchor="start">Pergunte, por exemplo, sobre o seu pace, a sua</text><text x="30" y="248" font-family="Inter, system-ui, sans-serif