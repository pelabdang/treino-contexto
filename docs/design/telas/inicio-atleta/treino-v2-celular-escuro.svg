<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1640" width="390" height="1640" role="img" aria-label="Tela do treino v2, celular, tema escuro"><title>Tela do treino v2, celular, tema escuro</title><desc>Número grande e feedback no topo, depois o normal, o que o atleta respondeu, os tiros, e por último carga, detalhes e clima.</desc><rect width="390" height="1640" fill="#0F1214"/><path d="M30,56 L22,64 L30,72 M22,64 L40,64" fill="none" stroke="#D2FF3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#D2FF3C" text-anchor="start">Voltar</text><circle cx="34" cy="108" r="14" fill="#232A2E"/><circle cx="36.0" cy="101.0" r="2.2" fill="#FF9A5C"/><path d="M35.0,105.0 L32.0,111.0 L28.0,113.0 M32.0,111.0 L37.0,114.0 L36.0,119.0 M35.0,105.0 L40.0,107.0 M35.0,105.0 L30.0,107.0" fill="none" stroke="#FF9A5C" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#B4BBC0" text-anchor="start">Corrida · terça 18/03/25, 06:30</text><text x="58" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="800" fill="#ECEEEF" text-anchor="start">Intervalado · 5 tiros de 1 km</text><rect x="16" y="144" width="358" height="330" rx="20" fill="#181C1F" stroke="#2C3236" stroke-width="1"/><text x="36" y="172" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#B4BBC0" text-anchor="start" letter-spacing="1">1  COMO FOI</text><text x="36" y="256" font-family="Barlow Condensed, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="800" fill="#ECEEEF" text-anchor="start">4:11</text><text x="202" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#B4BBC0" text-anchor="start">/km</text><text x="202" y="234" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#B4BBC0" text-anchor="start">melhor tiro</text><text x="36" y="284" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B4BBC0" text-anchor="start">10,00 km  ·  52:05  ·  FC média 152 bpm</text><line x1="36" y1="304" x2="354" y2="304" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="334" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ECEEEF" text-anchor="start">Você manteve os cinco tiros entre 4:11 e 4:23,</text><text x="36" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ECEEEF" text-anchor="start">com a FC estável. O melhor foi o primeiro e o</text><text x="36" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ECEEEF" text-anchor="start">ritmo caiu aos poucos. O esforço que você</text><text x="36" y="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ECEEEF" text-anchor="start">marcou (5, difícil) combina com a FC.</text><text x="36" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4BBC0" text-anchor="start">Gerado automaticamente a partir do treino e do seu check-in.</text><text x="36" y="456" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4BBC0" text-anchor="start">Dado de exemplo.</text><rect x="16" y="490" width="358" height="196" rx="20" fill="#181C1F" stroke="#2C3236" stroke-width="1"/><text x="36" y="518" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#B4BBC0" text-anchor="start" letter-spacing="1">2  COMPARADO AO SEU NORMAL</text><rect x="36" y="532" width="318" height="36" rx="18" fill="#232B10"/><circle cx="56" cy="550" r="9" fill="#D2FF3C"/><path d="M52,550 l3,3 l6,-6" fill="none" stroke="#232B10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="555" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#D2FF3C" text-anchor="start">Dentro do seu normal para intervalado</text><text x="36" y="596" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#ECEEEF" text-anchor="start">Melhor tiro</text><rect x="146" y="586" width="208" height="12" rx="6" fill="#232A2E"/><rect x="196" y="586" width="120" height="12" rx="6" fill="#232B10" stroke="#D2FF3C" stroke-width="1"/><circle cx="246" cy="592" r="8" fill="#9AA4F5" stroke="#181C1F" stroke-width="2.5"/><text x="246" y="620" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#9AA4F5" text-anchor="middle">hoje 4:11</text><text x="256" y="578" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#B4BBC0" text-anchor="middle">seu normal</text><text x="36" y="650" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#B4BBC0" text-anchor="start">FC média  152 bpm  ·  dentro</text><text x="36" y="670" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4BBC0" text-anchor="start">Normal: 4:08 a 4:24 /km (12 semanas, só intervalados).</text><rect x="16" y="702" width="358" height="188" rx="20" fill="#181C1F" stroke="#2C3236" stroke-width="1"/><text x="36" y="730" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#B4BBC0" text-anchor="start" letter-spacing="1">3  O QUE VOCÊ RESPONDEU</text><text x="36" y="760" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Esforço</text><text x="354" 