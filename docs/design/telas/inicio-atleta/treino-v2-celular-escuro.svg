w', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ECEEEF" text-anchor="middle">4:11</text><text x="67" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#B4BBC0" text-anchor="middle">1º</text><rect x="110" y="986" width="46" height="116" rx="8" fill="#232A2E" stroke="#9AA4F5" stroke-width="1.5"/><text x="133" y="978" font-family="Barlow Condensed, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ECEEEF" text-anchor="middle">4:14</text><text x="133" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#B4BBC0" text-anchor="middle">2º</text><rect x="176" y="1000" width="46" height="102" rx="8" fill="#232A2E" stroke="#9AA4F5" stroke-width="1.5"/><text x="199" y="992" font-family="Barlow Condensed, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ECEEEF" text-anchor="middle">4:17</text><text x="199" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#B4BBC0" text-anchor="middle">3º</text><rect x="242" y="1014" width="46" height="88" rx="8" fill="#232A2E" stroke="#9AA4F5" stroke-width="1.5"/><text x="265" y="1006" font-family="Barlow Condensed, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ECEEEF" text-anchor="middle">4:20</text><text x="265" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#B4BBC0" text-anchor="middle">4º</text><rect x="308" y="1028" width="46" height="74" rx="8" fill="#232A2E" stroke="#9AA4F5" stroke-width="1.5"/><text x="331" y="1020" font-family="Barlow Condensed, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ECEEEF" text-anchor="middle">4:23</text><text x="331" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#B4BBC0" text-anchor="middle">5º</text><text x="36" y="1134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4BBC0" text-anchor="start">Barra mais alta = mais rápido. FC por tiro na tela cheia.</text><rect x="16" y="1160" width="358" height="360" rx="20" fill="#181C1F" stroke="#2C3236" stroke-width="1"/><text x="36" y="1188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#B4BBC0" text-anchor="start" letter-spacing="1">5  CONTEXTO</text><text x="36" y="1218" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Duração</text><text x="354" y="1218" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">0:52:05</text><line x1="36" y1="1229" x2="354" y2="1229" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Distância</text><text x="354" y="1250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">10,00 km</text><line x1="36" y1="1261" x2="354" y2="1261" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Pace médio</text><text x="354" y="1282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">5:12 /km</text><line x1="36" y1="1293" x2="354" y2="1293" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1314" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">FC média</text><text x="354" y="1314" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">152 bpm</text><line x1="36" y1="1325" x2="354" y2="1325" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Carga do treino (estimativa)</text><text x="354" y="1346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">86 pontos</text><line x1="36" y1="1357" x2="354" y2="1357" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Temperatura</text><text x="354" y="1378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">24,3 °C</text><line x1="36" y1="1389" x2="354" y2="1389" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Sensação térmica</text><text x="354" y="1410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">25,1 °C</text><line x1="36" y1="1421" x2="354" y2="1421" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="36" y="1442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B4BBC0" text-anchor="start">Umidade</text><text x="354" y="1442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEF" text-anchor="end">61 %</text><line x1="36" y1="1453" x2="354" y2="1453" stroke="#2C3236" stroke-width="1" stroke-linecap="butt"/><text x="3