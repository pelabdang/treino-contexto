<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 860" width="390" height="860" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Direção C: Agora"><title>Direção C: Agora</title><desc>Tela inicial do atleta, direção C: um cartão grande com a próxima ação (responder check-in), depois o último treino com feedback e um resumo de carga e forma.</desc><rect width="390" height="860" fill="#F5F3EE"/><text x="16" y="40" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Olá, Ana</text><text x="16" y="60" font-size="13" font-weight="400" fill="#4C5257" text-anchor="start">Quinta, 13/11/25</text><circle cx="358" cy="38" r="16" fill="#ECEAE4"/><text x="358" y="43" font-size="14" font-weight="700" fill="#4C5257" text-anchor="middle">A</text><rect x="16" y="80" width="358" height="300" rx="10" fill="#DCEFEE" stroke="#0B6A6E"/><text x="30" y="108" font-size="11" font-weight="700" fill="#0B6A6E" text-anchor="start">AGORA</text><text x="30" y="142" font-size="20" font-weight="700" fill="#1F2326" text-anchor="start">Como foi a natação de ontem?</text><text x="30" y="166" font-size="13" font-weight="400" fill="#4C5257" text-anchor="start">Natação · 45 min · 20/03 às 07:00</text><text x="30" y="196" font-size="13" font-weight="400" fill="#4C5257" text-anchor="start">Duas perguntas rápidas. Leva menos de um minuto.</text><rect x="30" y="214" width="330" height="48" rx="10" fill="#0B6A6E" stroke="#0B6A6E"/><text x="195" y="244" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Responder o check-in</text><text x="30" y="292" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">Depois do check-in, o feedback deste treino</text><text x="30" y="312" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">aparece aqui.</text><text x="30" y="350" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="start">Outros 2 treinos sem check-in</text><text x="16" y="414" font-size="16" font-weight="700" fill="#1F2326" text-anchor="start">Seu último treino com feedback</text><rect x="16" y="428" width="358" height="120" rx="10" fill="#FFFFFF" stroke="#CFCBC2"/><text x="30" y="452" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">Corrida · 18/03/25</text><text x="30" y="484" font-size="16" font-weight="700" fill="#1F2326" text-anchor="start">4:11 min/km no melhor tiro</text><text x="30" y="508" font-size="13" font-weight="400" fill="#1F2326" text-anchor="start">Feedback: texto de exemplo do feedback...</text><text x="360" y="538" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="end">Abrir &gt;</text><text x="16" y="584" font-size="16" font-weight="700" fill="#1F2326" text-anchor="start">Resumo</text><rect x="16" y="596" width="174" height="64" rx="10" fill="#FFFFFF" stroke="#CFCBC2"/><text x="30" y="620" font-size="11" font-weight="700" fill="#4C5257" text-anchor="start">Carga da semana</text><text x="30" y="648" font-size="16" font-weight="700" fill="#1F2326" text-anchor="start">412 pontos</text><rect x="200" y="596" width="174" height="64" rx="10" fill="#FFFFFF" stroke="#CFCBC2"/><text x="214" y="620" font-size="11" font-weight="700" fill="#4C5257" text-anchor="start">Forma</text><text x="214" y="648" font-size="16" font-weight="700" fill="#1F2326" text-anchor="start">-8</text><text x="16" y="696" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">Em dia: o cartão &#x27;Agora&#x27; vira o último treino</text><text x="16" y="712" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">com feedback e o resto sobe.</text><rect x="0" y="796" width="390" height="64" rx="0" fill="#FFFFFF" stroke="#CFCBC2"/><circle cx="48.75" cy="818" r="10" fill="#0B6A6E"/><text x="48.75" y="846" font-size="12" font-weight="700" fill="#0B6A6E" text-anchor="middle">Início</text><circle cx="146.25" cy="818" r="10" fill="#ECEAE4"/><text x="146.25" y="846" font-size="12" font-weight="400" fill="#4C5257" text-anchor="middle">Treinos</text><circle cx="243.75" cy="818" r="10" fill="#ECEAE4"/><text x="243.75" y="846" font-size="12" font-weight="400" fill="#4C5257" text-anchor="middle">Evolução</text><circle cx="341.25" cy="818" r="10" fill="#ECEAE4"/><text x="341.25" y="846" font-size="12" font-weight="400" fill="#4C5257" text-anchor="middle">Conta</text></svg>