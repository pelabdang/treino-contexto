280" y="464" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4BBC0" text-anchor="start">Texto de exemplo.</text><rect x="264" y="492" width="480" height="206" rx="12" fill="#181C1F" stroke="#2C3236" stroke-width="1"/><text x="280" y="520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#B4BBC0" text-anchor="start" letter-spacing="1">2  COMPARADO AO SEU NORMAL</text><rect x="280" y="536" width="291.3" height="34" rx="17.0" fill="#232B10"/><circle cx="298" cy="553.0" r="7" fill="#D2FF3C"/><path d="M294.5,553.0 l2.5,2.5 l4.5,-4.5" fill="none" stroke="#232B10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="557.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D2FF3C" text-anchor="start">Dentro do seu normal para intervalado</text><text x="280" y="604" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#ECEEEF" text-anchor="start">Melhor tiro</text><rect x="382" y="594" width="338" height="12" rx="6" fill="#232A2E"/><rect x="442.84" y="594" width="169.0" height="12" rx="6" fill="#232B10" stroke="#D2FF3C" stroke-width="1"/><circle cx="483.4" cy="600" r="8" fill="#9AA4F5" stroke="#181C1F" stroke-width="2.5"/><text x="483.4" y="628" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#9AA4F5" text-anchor="middle">hoje 4:11</text><text x="527.3399999999999" y="586" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#B4BBC0" text-anchor="middle">seu normal</text><text x="280" y="658" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#B4BBC0" text-anchor="start">FC média  152 bpm  ·  dentro do normal</text><text x="280" y="680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight=