<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" width="390" height="520" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Navegação proposta"><title>Navegação proposta</title><desc>Mapa de navegação: quatro abas do atleta (Início, Treinos, Evolução, Conta) e a navegação do professor (Caixa do dia, Alunos depois, Conta).</desc><rect width="390" height="520" fill="#F5F3EE"/><text x="16" y="26" font-size="15" font-weight="700" fill="#1F2326" text-anchor="start">Atleta</text><text x="16" y="42" font-size="11" font-weight="400" fill="#4C5257" text-anchor="start">celular: abas na base · computador: menu à esquerda</text><rect x="16" y="52" width="83" height="200" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="57" y="76" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Início</text><text x="22" y="102" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">último treino</text><text x="22" y="122" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">+ feedback,</text><text x="22" y="142" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">check-in</text><text x="22" y="162" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">pendente,</text><text x="22" y="182" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">carga e forma</text><rect x="105" y="52" width="83" height="200" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="146" y="76" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Treinos</text><text x="111" y="102" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">todos os treinos,</text><text x="111" y="122" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">filtro por</text><text x="111" y="142" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">modalidade,</text><text x="111" y="162" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">check-ins</text><text x="111" y="182" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">pendentes</text><rect x="194" y="52" width="83" height="200" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="235" y="76" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Evolução</text><text x="200" y="102" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">tiros de 1 km,</text><text x="200" y="122" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">série de carga</text><text x="200" y="142" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">e forma,</text><text x="200" y="162" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">o normal</text><rect x="283" y="52" width="83" height="200" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="324" y="76" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Conta</text><text x="289" y="102" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">semana-padrão,</text><text x="289" y="122" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">consentimento</text><text x="289" y="142" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">(selo se há</text><text x="289" y="162" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">pedido),</text><text x="289" y="182" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">trocar senha,</text><text x="289" y="202" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">sair</text><text x="16" y="290" font-size="15" font-weight="700" fill="#1F2326" text-anchor="start">Professor</text><text x="16" y="306" font-size="11" font-weight="400" fill="#4C5257" text-anchor="start">hoje: uma tela · depois: alunos</text><rect x="16" y="316" width="110" height="120" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="71" y="340" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Caixa do dia</text><text x="22" y="368" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">para olhar hoje,</text><text x="22" y="386" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">treinos novos</text><rect x="134" y="316" width="110" height="120" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="189" y="340" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Alunos</text><text x="140" y="368" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">(depois) lista e</text><text x="140" y="386" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">visão de cada</text><text x="140" y="404" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">aluno</text><rect x="252" y="316" width="110" height="120" rx="8" fill="#FFFFFF" stroke="#CFCBC2"/><text x="307" y="340" font-size="13" font-weight="700" fill="#0B6A6E" text-anchor="middle">Conta</text><text x="258" y="368" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">trocar senha,</text><text x="258" y="386" font-size="10" font-weight="400" fill="#4C5257" text-anchor="start">sair</text><text x="16" y="470" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">Regra: no máximo 4 abas; ajustes ficam em Conta;</text><text x="16" y="488" font-size="12" font-weight="400" fill="#4C5257" text-anchor="start">ação urgente (check-in) aparece no Início e como selo.</text></svg>