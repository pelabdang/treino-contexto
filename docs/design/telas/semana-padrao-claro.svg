<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1400" viewBox="0 0 360 1400" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Esboço da tela Semana-padrão, tema claro</title>
  <desc id="d">Esboço da issue 267. Dados sintéticos. Largura de celular pequeno (360). Mostra segunda a quinta; sexta a domingo seguem o mesmo molde.</desc>
